# Hospedagem do servidor do Jursistemy.
#
# Os dados ficam no banco gerenciado (Turso), e não em disco da máquina. É o que
# permite plano gratuito: o serviço pode hibernar e ser recriado sem perder
# nada, porque nada relevante mora nele. O servidor serve também a interface,
# de modo que tudo fica na mesma origem — é o que faz o cookie de sessão
# funcionar sem exceções de navegador.
services:
  - type: web
    name: jursistemy
    runtime: docker
    dockerfilePath: ./servidor/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/saude
    envVars:
      # Banco gerenciado. Sem estas duas, o servidor cai para disco local, que
      # plano gratuito não preserva.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SENTINELA_HTTPS
        value: "true"
      # Endereço público do serviço, usado no link de redefinição de senha.
      - key: SENTINELA_ENDERECO
        sync: false
      # Provedor de e-mail (formato da API do Resend e compatíveis).
      - key: SENTINELA_EMAIL_ENDPOINT
        sync: false
      - key: SENTINELA_EMAIL_CHAVE
        sync: false
      - key: SENTINELA_EMAIL_REMETENTE
        sync: false
      # Segredo de assinatura das sessões. Em serviço que reinicia sozinho, ele
      # precisa ser fixo: gerado a cada partida, toda sessão cairia.
      - key: SENTINELA_SEGREDO
        generateValue: true
